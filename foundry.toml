[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"  # Required for mcopy instruction
# Enable fork testing
ffi = true
# Increase the default timeout for tests
test_timeout = 100000
gas_reports = ["ZKarnageYul"]

fs_permissions = [{ access = "read-write", path = "./"}]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
